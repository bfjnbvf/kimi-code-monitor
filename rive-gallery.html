<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Kimi 吉祥物动画画廊</title>
<style>
  body { margin: 0; padding: 20px; background: #f5f5f5; font-family: -apple-system, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .tip { font-size: 12px; color: #888; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .cell {
    background: #fff; border: 2px solid #e5e5e5; border-radius: 10px;
    padding: 8px 4px 6px; text-align: center; cursor: pointer; user-select: none;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .cell:hover { border-color: #1783ff; }
  .cell.picked { border-color: #16c456; background: rgba(22,196,86,0.06); }
  .cell canvas { width: 84px; height: 84px; display: block; margin: 0 auto 4px; }
  .name { font-size: 12px; font-family: ui-monospace, monospace; color: #333; display: block; user-select: text; cursor: text; padding: 1px 4px; border-radius: 4px; }
  .name:hover { background: rgba(23,131,255,0.1); }
  .badge { font-size: 10px; color: #999; display: block; margin-top: 2px; }
</style>
</head>
<body>
<h1>Kimi 吉祥物动画画廊</h1>
<div class="tip">点卡片标记想要的动画（绿框 = 已选）；点动画名字直接复制；标「静帧姿态」的是单帧不会动</div>
<div class="grid" id="grid"></div>
<script src="/rive/rive.js"></script>
<script>
  rive.RuntimeLoader.setWasmUrl('/rive/rive.wasm');
  rive.RuntimeLoader.setWasmFallbackUrl(null);
  const ANIMS = ["blueface","redface","paopao","yaoyiyao","hover","↙","←","↖","↓","↑","history_blue","↘","history_gary","→","stop","angryface","↗","paopao_stop","hover100","wink","stars","loading","angryeye","in","look_forward_loop","look_right_stop","look_right","look_forward","change_light","change_dark","jump","nostars","hover0","wink_stop","UpDown","front","angrywink"];
  const grid = document.getElementById('grid');
  for (const name of ANIMS) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<canvas width="144" height="144"></canvas><span class="name">${name}</span>`;
    cell.addEventListener('click', () => cell.classList.toggle('picked'));
    grid.appendChild(cell);
    const canvas = cell.querySelector('canvas');
    const nameEl = cell.querySelector('.name');
    // 点名字复制（不触发卡片选中）
    nameEl.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(name).then(() => {
        nameEl.textContent = '已复制 ✓';
        setTimeout(() => { nameEl.textContent = name; }, 800);
      }).catch(() => {});
    });
    const r = new rive.Rive({
      src: '/rive/kimi_avatar_web-PnsTWI-X.riv',
      canvas,
      autoplay: true,
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      onLoad: () => {
        r.stop();
        r.play(name);
        // 一次性动画播完自动重播（?noreplay 时关闭，供静帧检测用）
        if (!location.search.includes('noreplay')) {
          r.on('stop', () => setTimeout(() => r.play(name), 500));
        }
      }
    });
    // 静帧检测：对比 1.2s 间隔的两帧，完全一致则标注（它们是状态机用的静态姿态）
    setTimeout(() => {
      const a = canvas.toDataURL('image/png');
      setTimeout(() => {
        if (canvas.toDataURL('image/png') === a) {
          cell.classList.add('static');
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '静帧姿态';
          cell.appendChild(badge);
        }
      }, 1_200);
    }, 1_500);
  }
</script>
</body>
</html>
