<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>head image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  #head {
    width: 1280px;
    height: 640px;
    display: flex;
    overflow: hidden;
    background: #ffffff;
  }
  #left {
    width: 500px;
    height: 640px;
    padding: 60px 56px;
    background: linear-gradient(150deg, #1a88ff 0%, #0f5fd6 60%, #0a47ad 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
  }
  #left h1 {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  #left .tag {
    margin-top: 14px;
    font-size: 19px;
    opacity: 0.88;
    font-weight: 400;
  }
  #left ul {
    margin-top: 38px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  #left li {
    font-size: 16.5px;
    line-height: 1.55;
    opacity: 0.94;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  #left li svg {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    stroke: #ffffff;
    stroke-width: 1.6;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.92;
  }
  #left li b {
    display: block;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 3px;
    opacity: 1;
  }
  #right {
    flex: 1;
    height: 640px;
    background: linear-gradient(150deg, #eef4ff 0%, #dde8fb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #right img {
    width: 780px;
    border-radius: 10px;
    box-shadow: 0 14px 40px rgba(20, 60, 140, 0.22);
  }
</style>
</head>
<body>
<div id="head">
  <div id="left">
    <h1>Kimi Code Monitor</h1>
    <div class="tag">Kimi Code Web 的侧边栏监控扩展</div>
    <ul>
      <li><svg viewBox="0 0 24 24"><path d="M4 14a8 8 0 1 1 16 0"/><path d="M12 14l4-5"/><circle cx="12" cy="14" r="1.6"/></svg><span><b>额度与用量</b>5h / 本周额度进度、token 输入输出、缓存命中率、生成速度，实时可见</span></li>
      <li><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span><b>消耗量统计</b>按天累计，主/子代理拆分，可导出 JSON</span></li>
      <li><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke-dasharray="3 2.5"/></svg><span><b>模块化面板</b>信息块自由拖拽组合，不同大小有不同功能</span></li>
      <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="11" r="1.1" fill="#ffffff" stroke="none"/><circle cx="15" cy="11" r="1.1" fill="#ffffff" stroke="none"/></svg><span><b>Kimi 小蓝球指示灯</b>空闲 / 执行等状态有专属动画（官方 Rive 动画）</span></li>
    </ul>
  </div>
  <div id="right">
    <img src="window.png" alt="Kimi Code Monitor 实际运行效果">
  </div>
</div>
</body>
</html>
